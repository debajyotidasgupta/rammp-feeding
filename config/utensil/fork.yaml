# The fork in the gripper. Re-measure all of this whenever the utensil is changed OR re-seated
# (a robot restart re-initialises the gripper; on 2026-09-24 it pivoted the fork by (-14, -65) px).
# A new utensil: copy this file (e.g. spoon.yaml), measure, select it in rammp.yaml (profiles.utensil).

name: fork
camera_to_tip_m: 0.265          # measured 260-261 (ruler to bare table + depth; camera case + 6.7 mm); stored long on
                                # purpose, so every stop errs high: a nominal 10 mm hover looks like 15-20 mm by eye
tip_px: [685, 476]              # the tine tips in the colour image (the fork is fixed to the camera: the same pixels
                                # at every pose). 2026-09-25, measured in the overlook image: the white fork's top
                                # 12 rows, x 657..724 -> 49 mm off the camera's vertical at camera_to_tip. Was
                                # (644, 405), 34.5 mm off: a cube plunge landed ~15 mm -X, ~12 mm -Y of centre,
                                # which the correction accounts for (fork_20260924.yaml keeps the old values)
image_region_px: [640, 460, 760, 719]   # its pixels at the overlook -- never detected, never mistaken for food
tine_offset_tool_m: [-0.005, 0.0, 0.0]   # the tines' offset from tip_px's tip, TOOL frame: the fork head curves, so
                                    # they meet the food off where the image puts the tip. Part of the tip model
                                    # (kinova/motion.tip_in_tool: plunge, scoop pivot, the approach to the mouth) and
                                    # of OVER's aim. User, at a 10 mm hover on a cube, 2026-09-25: base -5 mm y at
                                    # the overlook = tool -5 mm x (2026-09-24's -6 mm was the same effect)
head_width_m: 0.023             # the fork head, across the tines (user, ruler, 2026-09-25). Cross-check: it spans
                                # ~110 px in the image (x 640..750) = 22.5 mm at camera_to_tip
# the aim offset depends on the food as much as the fork: config/food/<name>.yaml
punch_floor_margin_m: 0.0       # nominal margin above the measured bowl floor; really ~5-10 mm (see camera_to_tip)
