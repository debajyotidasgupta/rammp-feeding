# rammp_feeding -- everything that is tuned, switched on or off, or changes with the deployment (rammp_feeding/config.py).
# Layers, later wins: this file < the selected profiles < the machine's own local.yaml (in state_dir) < the measured
# wrist mount (state_dir/wrist_mount.json) < RAMMP_SET. A site sets its own facts in local.yaml (docs/porting.md);
# the keys marked SITE below are the ones it always sets.
# Units are in the key names: _m metres, _mps m/s, _dps deg/s, _dps2 deg/s^2, _nm N.m, _n N, _s s, _px pixels.

profiles:
  camera: realsense_d405        # config/camera/<name>.yaml: the wrist camera -- its topics (its mount: calibrate-wrist)
  scene_camera: orbbec_gemini336l   # the fixed scene camera: the COARSE bowl + table (rammp locate-scene)
  utensil: fork                 # config/utensil/<name>.yaml: the utensil (its ruler reading and pixels: per site)
  bowl: front                   # config/bowl/<name>.yaml: the bowl's floor
  food: cubes                   # config/food/<name>.yaml: the detector prompt

deployment:
  state_dir: /config            # the machine's own state, kept across runs: local.yaml, captured poses, the scene
                                # camera's pose and latest reading (mounted from the host)
  runs_dir: /runs               # the run record (mounted from the host)

record:                         # the run record (rammp_feeding/record.py): every stage's images, depth, telemetry, log
  enabled: false                # a debug setting: off, nothing is written under runs_dir (the node's `record` parameter)

ros:                            # the RAMMP stack's interfaces this module uses (the arm stack's 2.0 generation)
  robot_description: /arm/robot_description         # kinova-gen3-ros2's description node: the model, rooted at arm_mount
  joint_states: /joint_states                        # kinova-gen3-ros2: arm_joint_1..7 (about 50 Hz)
  control_status: /control_status
  execute_action: /execute_joint_trajectory
  plan_action: /rammp_curobo/plan_to_joints          # RAMMP-CuRobo (plan only)
  plan_pose_action: /rammp_curobo/plan_to_pose       # ... to a tool pose, its tilt held on the way (carrying a cup)
  set_world_service: /rammp_curobo/set_world
  planner_reset: /reset                              # RAMMP-CuRobo: its own world back, after us
  detect_service: /perception/sam3/detect            # rammp-perception's SAM3: every detection (bowl, food)

planner:                         # the shared planner: the arm's paths; the utensil is ours to check (Arm.check_path)
  utensil_spheres:               # the utensil as our check of each planned path takes it: spheres from the gripper's
                                 # pads to the tip, tool frame (radii with the 5 mm the planner adds to the arm's own)
    from_tool_m: [0.0, 0.0, 0.05]   # the first, at the pads (0.17 m out of the flange)
    count: 5
    radius_m: 0.017
    tip_radius_m: 0.025         # the last, round the tines
    food_radius_m: 0.025        # carrying (the swing): a ~25 mm piece riding the tip ...
    food_back_m: 0.010          # ... centred this far back from it along the tool's z
  world_file: /config/planner_world.yaml   # our collision world (scene.world), pushed before each planned move ...
  world_file_in_planner: /feeding/planner_world.yaml   # ... where the planner's container reads it: the deployment
                                           # mounts this state directory into the planner at /feeding

arm:
  base_frame: arm_mount         # the model's root: every position here, the planner's world, the scene camera's parent
  tool_from_flange_m: [0.0, 0.0, 0.12]   # the 2F-85's TCP (the model's arm_tool_frame): the utensil and camera mount
                                # are measured in it

face:
  model: /opt/models/face_landmarker.task   # MediaPipe's face landmarker (in the image)

workspace:                      # arm base frame, m (where the bowl and the table are: the scene camera's reading)
  bowl_centre_m: null           # SITE [x, y]: where the operator lays the bowl -- the scene camera's bowl nearest it is taken
  table_extent_m: null          # SITE {x: [near, far], y: [right, left]}: the table's edges (the planner's table, where our
                                # tip floor applies)
  table_height_m: null          # SITE: the table's top, z (a tape from the arm's base): the one table every module on this
                                # robot uses (feeding, drinking); null: each meal's scene camera reading
  overlook_camera_height_m: 0.45   # food_detect_start: the wrist camera this high above the table, over the bowl

motion:
  joint_speed_cap_dps: 61.7     # every joint, every move: 0.98 x the slowest joint's soft limit the arm ran under (63)
  joint_accel_dps2: 45.0        # every joint's speed changes at most this fast (72, the controller's cap, / 1.6: what the
                                # arm measured against the plan)
  trajectory_sample_s: 0.02     # a move is sent as its smooth speed profile sampled this often: the arm follows the
                                # timed points directly, and a speed held over longer pieces jumps from one to the next
  max_tilt_deg: 25.0            # the utensil's worst tilt off straight down on any move, but 5 deg past the move's own
                                # start or end where either is further (a move that turns it on purpose)
  max_joint_step_deg: 12        # a continuous IK path: a bigger step on any joint is a jump, not a path
  steer_within_deg: 25          # IK seeds steer J2 / J4 / J6 off a limit once within this of it ...
  steer_step_deg: 3.0           # ... by this much per step
  near_pose_deg: 1.0            # within this of a pose's joints = "at" that pose
  arrived_m: 0.002              # a straight move this short is no move
  settle_dps: 10.0              # a short joint move onto a goal (after a planned path)
  direct_dps: 20.0              # rammp home --direct: one joint move to feeding_start, no planner
  path_tolerance_deg: 20.0      # the driver aborts a move the arm diverges from by this much on any joint
  goal_tolerance_deg: 1.0
  watch_extra_s: 15             # a move not finished this long after its planned time: stopped
  impedance:                    # compliant moves (ExecuteJointTrajectory control_mode 1): the driver's default gains
    approach: {kq: [80, 80, 80, 80, 30, 30, 30], zeta: 0.7, torque_limit: [39, 39, 39, 39, 9, 9, 9]}
  free_space:                   # detect, home, the swing, the retract's return: cuRobo paths
    dps: 61.0                   # cruise, the furthest joint (every planned move)
    path_step_deg: 1            # cuRobo's dense path thinned to about this on the furthest joint (its curve kept)
    timeout_s: 30
    replans: 4                  # a path that fails our check: plan again (cuRobo's paths differ), at most this often
    check_step_deg: 0.5         # a planned path is checked as it will run: sampled this finely on the furthest joint
    utensil_padding_m: 0.01     # the utensil check: our boxes (the bowl, the user) grown this per side (the bowl exact) ...
    utensil_clearance_m: 0.0    # ... and the utensil's spheres kept this clear of them (0: out of them)
    min_tip_above_table_m: 0.05 # our floor for the utensil tip (scene.tip_floor): above the table (and the planner's
                                # table raised to it: the utensil hangs below the gripper) ...
    min_tip_above_bowl_m: 0.015 # ... above the bowl's top over the bowl
    bowl_margin_m: 0.04         # "over the bowl": within its rim radius + this

guards:                         # the contact guard: a joint-torque step this big against recent history = stop
  torque_window: {span: 6, gap: 3}    # samples (/joint_states at 50 Hz): the baseline window, and the gap before the
                                      # sample compared to it
  torque_step_nm:
    default: 2.5
    approach: 4.0               # the user moving in the chair shakes the arm's mount past 2.5
    plunge_in_food: 8.0         # once the tines are in the food: firm food (grilled chicken) takes ~4 N.m to pierce
    scoop: 6.0                  # open air: 2.5 trips on the arm's own acceleration
    free_space: 6.0             # every planned move (detect, home, the swing, the retract's return)
  scoop_food_off_path_m: 0.015  # the food point this far off its planned path stops the scoop ...
  scoop_food_drop_m: 0.010      # ... or this far below it

acquisition:
  over_speed_mps: 0.15
  plunge:
    fast_mps: 0.050
    slow_mps: 0.008             # through the food
    slow_above_food_m: 0.020    # the overlook reads the food top 4-7 mm high; this covers it
    in_food_from_above_m: 0.003 # the guard treats the tines as in the food this far before the measured top
    ik_step_m: 0.006
    ramp_start_frac: 0.25       # the speed profile: starts at this fraction of fast_mps, full speed after ramp_m,
    ramp_m: 0.015               # and eases (smoothstep) to slow_mps over ease_m before the slow zone
    ease_m: 0.015
    food_height_range_m: [0.010, 0.060]
  scoop:
    speed_dps: 55.0             # fast on purpose: food slides off a slowly tilting utensil
    rot_exp: 0.8                # turn angle = 90 * s**rot_exp: <1 starts turning the moment the food lifts
    waypoints: 40
    backoff_from: 0.2           # fraction of the scoop before moving across to over the bowl's centre
    lift_m: 0.04                # the scoop ends with the piece this far over the free-space tip floor above the bowl's
                                # centre (its top + min_tip_above_bowl_m + the scene camera's error_m)
  stepped:                      # the hover route, for aim checks (tip_px: rammp acquire --stop-after hover10, rise)
    hover_m: {hover30: 0.030, hover10: 0.010}
    descend_mps: 0.040          # one straight move down from the OVER pose, starting and stopping smoothly
    rise_mps: 0.040

perception:
  score_threshold: 0.5          # SAM3
  wrist_bowl_error_m: 0.010     # how far the wrist camera's bowl and table (rammp detect, from food_detect_start) may be
                                # off: once it has read them, the planner's world and our tip floor keep this as clearance
                                # in place of the scene camera's error_m (the bowl's top stays the scene camera's)
  bowl_prompts: [bowl, dish, plate]   # SAM3's words for the bowl in the wrist camera (with the food's, one call): the
                                # best match is taken -- seen empty from above, a dark bowl scored 0.37 as "bowl", 0.71
                                # as "dish" and 0.88 as "plate"
  bowl_score_threshold: 0.3     # SAM3 on the bowl in the wrist camera (detect, perceive): it scores a dark bowl 0.4-0.6
  depth_frames: 15              # per-pixel median over this many frames after the arm stopped
  depth_wait_s: 3.0
  min_box_side_px: 25
  max_box_aspect: 3.0
  food_inside_bowl_min: 0.8     # fraction of a food box inside the bowl box
  food_max_frac_of_bowl: 0.15   # a "food" box bigger than this is the bowl
  inside_utensil_max: 0.5
  overlap_iou: 0.5              # a food box overlapping a better one this much is the same piece
  food_half_width_m: 0.017      # the floor ring round the spot under the tip
  tip_line_radius_m: 0.004      # "straight under the tip": depth points this near its vertical line
  utensil_depth_margin_m: 0.005 # under the tip, depth no farther than the tip + this is the utensil itself
  utensil_depth_border_px: 3
  food_left_above_floor_mm: 20  # no food box: the bowl is empty only if under food_left_min_frac of its inner floor
  food_left_min_frac: 0.05      # (within food_left_inner_frac of its rim radius, nothing above its rim: the utensil)
  food_left_inner_frac: 0.6     # stands this far above its floor -- else "food left, none pickable" (exit 5). An empty
                                # dark bowl: 3.6 % (its walls and inner ring, depth noise); a 20-30 mm piece counts
  scene:                        # the fixed scene camera (rammp locate-scene)
    bowl_prompts: [dish, bowl, bowl with a glass jar]   # SAM3's words for the bowl (from the side a bowl reads as a
                                # dish or a plate with a jar; "bowl" alone boxed a lidded box)
    score_threshold: 0.3
    max_bowl_height_m: 0.20     # inside its mask, the bowl is what stands this high at most above the table ...
    max_bowl_radius_m: 0.15     # ... and a circle through its rim wider than this is not a bowl's (both cameras)
  wrist_calibration:            # the ChArUco board: rammp calibrate-wrist (the wrist camera's mount) and calibrate-scene
    squares: [7, 9]             # across, down (rammp calibrate-wrist --board prints it)
    square_m: 0.025             # SITE: a square's side as printed -- measure across all of them (printers scale)
    marker_ratio: 0.72          # its marker's side / the square's
    dictionary: DICT_5X5_100
    legacy_pattern: false       # OpenCV's ChArUco layout before 4.6 (boards from calib.io and older OpenCV)
    rise_m: 0.10                # from feeding_start: up this much, then this far out from the base's axis, over the board
    out_m: 0.15
    pivot_m: 0.30               # the poses pivot on the point this far along the tool axis (the board, under the tool)
    tilt_deg: 10.0              # turned this much about the tool's x and y, each way ...
    turn_deg: 20.0              # ... and this much about its axis
    speed_dps: 10.0
    settle_s: 0.5               # after each move, before the image
    wait_board_s: 60.0          # at the first pose: how long to wait for the board to be laid under the camera
    min_corners: 12
    max_scale_error: 0.02       # at the first pose the board's distance by the camera's depth and by its image
                                # (square_m) agree this well, or it refuses: a scaled print moves the camera as much
    min_poses: 5                # of the 7
    max_spread_m: 0.005         # accepted when the board's place in the base frame agrees across the poses this well
    max_spread_deg: 1.0
    fork_height_m: 0.10         # the fork pass: the utensil's tips this high over the board's centre ...
    fork_shift_m: 0.03          # ... and shifted this much each way, the board sliding behind them
    fork_still_std: 8.0         # the utensil: pixels whose grey level varies less than this across the fork pass ...
    fork_corridor_px: 60        # ... within this of the tool's axis as the camera sees it
    tip_band_px: 6              # its tips: its pixels within this of its far end along that axis
    fork_margin_px: 10          # image_region_px: its box, grown by this

delivery:
  swing_max_tilt_deg: 105.0     # carrying the piece, the utensil's tines at most this far off straight down (90: level):
                                # tipped up to 15 deg above level the pierced piece slides toward the gripper, not off
  second_look_m: [0.0, -0.050, 0.0]   # no face or no usable mouth from the delivery look: this much further (base frame;
                                # -Y: to the user's right), straight, and look again
  look_mps: 0.044
  face_find_s: 2.0              # a look with no face found in this long: the second look (from the first) or refused
  stop_m: 0.080                 # the utensil tip this far short of the mouth
  aim_dz_m: -0.010              # below the mouth
  approach_mps: 0.077
  approach_impedance: null      # motion.impedance's entry the approach runs with (null: position control). Position:
                                # the driver's compliant mode (kinova-gen3-driver v1.2.0) spins a continuous joint the
                                # long way round when the target crosses +-180, and a mouth to the user's right takes
                                # joint 1 across it from the delivery look
  approach_step_m: 0.005
  max_turn_deg: 30.0            # the utensil turned toward the mouth by at most this
  level_tol: 0.1                # |utensil axis z| under this = level
  open_mouth_ratio: 0.20        # inner-lip gap / mouth width; closed reads <= 0.02
  open_mouth_hold_s: 0.30
  open_mouth_gap_s: 0.30        # frames with no face found inside the hold: skipped, up to this long
  open_mouth_timeout_s: 60.0    # no open mouth by then = the user declined
  bite_n: 2.0                   # the tool-frame force (from the joint torques) against a baseline at rest
  bite_hold_s: 0.10
  bite_settle_s: 10.0           # after the bite: at most this long for the force to settle (the user lets go)
  bite_timeout_s: 60.0
  bite_baseline_samples: 20     # (/joint_states at 50 Hz)
  face:
    eye_corners_m: 0.090        # the outer eye corners' spacing: the face's range without depth
    depth_beyond_eyes_factor: 1.6   # lips' depth past this x the eye-spacing range (and 0.3 m beyond) is not theirs
  retract:
    back_off_mps: 0.20
    reach_margin_m: 0.10        # the planned return keeps the tip within its start's / goal's reach + this

node:                           # the node's feed action (rammp_feeding/engine.py), one bite in at most ~105 s: the
  open_mouth_timeout_s: 25.0    # orchestrator cancels an action at 120 s. No open mouth by then: the user declined
  open_mouth_min_s: 10.0        # that wait in the meal's first feed, less the time it took to find the bowl, at least
  bite_timeout_s: 25.0          # no bite felt by then: back to the bowl, the food still on the fork
  bite_settle_s: 5.0            # after the bite: at most this long for the force to settle
