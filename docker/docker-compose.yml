services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    platform: linux/amd64
    image: rammp/kortex-ros2:humble
    container_name: rammp-ros2
    environment:
      KINOVA_IP: ${KINOVA_IP:-192.168.2.67}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # Uncomment with XQuartz running (`xhost +localhost`) for RViz.
      # DISPLAY: host.docker.internal:0
    volumes:
      - ../:/ws/rammp
      # - /tmp/.X11-unix:/tmp/.X11-unix
    stdin_open: true
    tty: true
    # The arm is on the LAN; bridge NAT handles outbound TCP:10000 and the
    # UDP:10001 reply path. No host networking needed just to reach it.
    command: bash
