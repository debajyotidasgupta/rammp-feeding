# The bowl in front of the user. Where it is is measured each session (the scene camera, then the wrist camera); this
# profile holds what depth cannot see.

name: front
floor_above_table_m: 0.005      # the bowl's inner floor above the table: 5 mm, a bowl standing flat on the table (measure
                                # it only for a bowl on a raised base). Two places read it, and only these: the plunge
                                # never goes under it (a clear bowl's floor is invisible to depth: it reads the table
                                # beneath), and the planner's world builds the bowl's floor box up to it
