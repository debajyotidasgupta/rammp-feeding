# Intel RealSense D435i fixed on the scene, through ROS 2 (its driver run as scene_camera with camera_name scene_camera,
# 640x480 colour and depth): the COARSE bowl + table (rammp locate-scene), never the aim. Its intrinsics and its internal
# transforms (link -> depth and colour optical frames) are its driver's (camera_info, /tf_static).

streams:
  colour_topic: /scene_camera/color/image_raw
  depth_topic: /scene_camera/depth/image_rect_raw

link_frame: scene_camera_link   # its driver's root frame (camera_name scene_camera): our calibration places it on the robot

error_m: 0.05                   # how far its reading may be off: the planner's world and our tip floor keep it as clearance

extrinsic:                      # base_link <- link_frame: rammp calibrate-scene measures it (state_dir/scene_extrinsic.json,
  xyz: null                     # which wins and is published on /tf_static); these are only the fit's starting guess
  quat_xyzw: null               # (a machine's local.yaml)
