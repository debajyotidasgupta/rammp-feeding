# The bowl in front of the user. Where it is is measured each session (the scene camera, then the wrist camera); this
# profile holds what depth cannot see.

name: front
floor_above_table_m: 0.020      # SITE: the bowl's inner floor above the table (a ruler): the plunge never aims under it --
                                # a clear bowl's floor is invisible to depth (it reads the table beneath)
