# Kinova Gen3 wrist camera (vision module), 1280x720 colour + 480x270 depth.
# A different camera: copy this file, measure, and select it in rammp.yaml (profiles.camera).

streams:
  kind: kinova_vision                     # the arm's vision module: depth via our kinova_vision nodes (make depth),
                                          # colour over RTSP from the arm; the camera server runs in that container
  colour_url: rtsp://{arm_ip}/color       # {arm_ip} is filled from deployment.arm.ip
  depth_topics: [/camera/depth/image_raw, /camera2/depth/image_raw]   # two depth nodes, 31 s apart:
                    # the arm ends each RTSP session every ~62 s and recovery takes 10-20 s (2026-09-25)

colour:
  width: 1280
  height: 720
  fx: 1297.673                  # device-reported
  fy: 1298.631
  cx: 657.4                     # MEASURED (the factory 620.914 is a crop offset): 3 unoccluded berries in depth + colour
  cy: 225.7                     # factory 238.28
  vertical_vp: [657.6, 236.6]   # image of TRUE vertical at food_detect_start (SIFT features across a vertical move)
  focus_point_px: [630, 245]    # where autofocus should look (the bowl) -- only if focus is lost

depth:
  width: 480
  height: 270
  fx: 334.810
  fy: 334.810
  cx: 238.536
  cy: 139.694
  depth_to_colour_m: [-0.02706, -0.00997, -0.00471]   # factory extrinsic (translation)
  # Correction for a sensor that reads off by a tolerance: true = scale * reading + offset_m.
  # 1.0 / 0.0 = trust the sensor (it matched the ruler to ~1 mm on this unit).
  scale: 1.0
  offset_m: 0.0
  min_valid_m: 0.12

mount:
  camera_in_tool_m: [0.0, 0.05639, -0.12305]   # Kinova's URDF: colour camera in the TOOL frame (120 mm tool offset)
  image_rotated_at_delivery: true              # at the delivery pose world-up is image-left: rotate 90 deg clockwise
