# Intel RealSense D405 on the wrist, through ROS 2 (rammp-deployments: wrist_camera -> d405_docker, its defaults:
# align_depth off). Its intrinsics and its depth -> colour transform are its driver's (camera_info, /tf_static); its
# colour comes off the depth module, so the two share one sensor.

streams:
  colour_topic: /wrist_camera/color/image_raw
  depth_topic: /wrist_camera/depth/image_rect_raw

glass_to_optical_m: 0.003       # its optical origin behind the front glass (a utensil's ruler reading starts at the glass)

mount:                          # where it sits on the arm (ours): the colour optical frame in the tool frame
  camera_in_tool_m: [0.0, 0.075, -0.125]       # 75 mm off the axis, the lens about the flange's plane
  rotation_quat_xyzw: [0.0, 0.0, 1.0, 0.0]      # a half turn about the tool axis (image +u = tool -x, +v = tool -y)
  image_rotated_at_delivery: true              # the face is upright after a quarter turn at the user
