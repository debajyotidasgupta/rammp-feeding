# RAMMP -- everything that is tuned, switched on or off, or changes with the deployment.
#
# Read by settings.py (python: `from settings import cfg`; shell: `python3 -m settings get <key>`).
# Layers, later wins:  this file  <  the selected profiles (camera / utensil / bowl)  <  config/local.yaml
#                      (per machine, not committed)  <  RAMMP_SET="key=value,key=value" (one run).
# Units are in the key names: _m metres, _mps m/s, _dps deg/s, _dps2 deg/s^2, _nm N.m, _n N, _s s, _px pixels.

profiles:
  camera: kinova_wrist          # config/camera/<name>.yaml -- intrinsics, extrinsic, depth correction, streams
                                # (kinova_wrist: the arm's own vision module; realsense_d405: a ROS 2 D405)
  scene_camera: ""              # optional: a fixed camera on the scene (config/camera/<name>.yaml with an `extrinsic`),
                                # for the COARSE bowl + table position (make locate-scene); "" = none: workspace below
  utensil: fork                 # config/utensil/<name>.yaml -- camera-to-tip, tip pixel, aim offset, ...
  bowl: front                   # config/bowl/<name>.yaml -- the overlook pose over it, where the scoop ends
  food: cubes                   # config/food/<name>.yaml -- the detector prompt, the aim offset

deployment:
  # Per machine, in its config/local.yaml: `root`, `name`, the arm's `ip`, and a port only if one clashes.
  # Everything else below is derived from them ({root}, {name}), so a machine's file holds only its own facts.
  root: "~"                     # where this machine keeps our things (venvs, models, runs, sources); RAMMP_ROOT wins
  name: rammp                   # names our containers and images here (a shared box: one prefix to clean up)
  arm:
    ip: 192.168.2.67
    username: admin             # KINOVA_USERNAME / KINOVA_PASSWORD in the environment win over these
    password: admin
    tcp_port: 10000
    udp_port: 10001
    soft_limits:                # ON the arm (Kinova ControlConfig); `make limits` applies these, saving the old ones
      joint_speed_dps: [70.0, 70.0, 70.0, 70.0, 63.0, 63.0, 63.0]   # per joint, under the hard limits (80 / 70): at
                                # the hard limit a tracking overshoot can fault the arm mid-move
      modes: [ANGULAR_TRAJECTORY, CARTESIAN_TRAJECTORY, CARTESIAN_WAYPOINT_TRAJECTORY]
    tool:                       # ON the arm (ControlConfig): every cartesian target and the tool pose are in this frame,
                                # and the mass feeds the torque model the contact guard and bite detection read. The
                                # tip model (camera.mount, utensil) is measured against it. Every move refuses on a
                                # mismatch; `make tool APPLY=1` sets it (saving the values it replaces)
      transform_m: [0.0, 0.0, 0.12]     # the 2F-85's TCP, flange frame (calibration/*_pose.json were captured with it)
      rotation_deg: [0.0, 0.0, 0.0]
      mass_kg: 0.831                    # gripper + utensil
      mass_centre_m: [0.0, 0.0, 0.0473]
      tolerance: {transform_m: 0.002, rotation_deg: 0.5, mass_kg: 0.02}
  containers: {driver: "{name}_driver", vision: "{name}_vision", camera: "{name}_camera",
               scene_camera: "{name}_scene_camera", planner: "{name}_planner"}   # make driver / depth / camera / planner
  images: {driver: "{name}/driver:py310", vision: "{name}/kortex-vision:humble",   # make driver-image / vision
           planner: "{name}/curobo:0.7.8"}   # torch + cuRobo v0.7.8 + rammp_curobo (RAMMP-CuRobo's docker/, or
                                             # docker/Dockerfile.planner_x86 on x86); our tree is mounted into it
  ros_domain_id: 0              # our ROS 2 traffic (the depth nodes); a box running other ROS 2 needs its own
  venvs: {detector: "{root}/venvs/la", face: "{root}/venvs/mp"}
  paths:
    da3_src: "{root}/da3src"                  # the Depth Anything 3 checkout (on PYTHONPATH for the detector)
    hf_home: "{root}/.cache/huggingface"      # the Hugging Face model cache (with root ~: its usual place)
  runs_dir: "{root}/rammp_runs"
  models:
    face_landmarker: "{root}/models/face_landmarker.task"
    depth_anything: depth-anything/DA3METRIC-LARGE
  servers:                      # resident processes, all on localhost (make models)
    detector_port: 8765         # LocateAnything + Depth Anything 3
    face_port: 8766             # MediaPipe
    camera_port: 8767           # the camera server (feeding/camera_server.py): depth medians, colour frames
    scene_camera_port: 8768     # ... the scene camera's
    planner_port: 8769          # the cuRobo planner server (make planner)
    startup_timeout_s: 300      # make models waits this long for all of them

preflight:                      # make preflight (make feed runs it first): the arm as the calibration assumes it
  kinematics_mm: 3.0            # at feeding_start, the tool pose the arm reports vs the captured one: more = re-capture
  kinematics_deg: 1.0
  allow_other_clients: false    # another program connected to the arm fails the preflight (true: a warning only)

workspace:                      # where the table and the bowl are (arm base frame, m), when no scene camera says
  table_height_m: 0.2140        # the table surface beside the bowl
  bowl_centre_m: [0.2692, 0.2765]
  bowl_height_m: 0.06           # rim above the table
  bowl_radius_m: 0.08
  table_extent_m: {x: [0.08, 0.76], y: [-0.30, 0.80]}   # its footprint: the planner's table box, and where the
                                # utensil's floor applies (feeding_start parks beside it, below its top)
  overlook_camera_height_m: 0.45   # food_detect_start: the wrist camera this high above the table, over the bowl
                                   # (with the scene camera's 5 cm error, 0.40 leaves no room: tests/scene_error_study.py)
  scene_max_age_s: 3600         # make detect refuses a scene camera reading (make locate-scene) older than this; it is trusted
                                # to its extrinsic.error_m: the planner's table and bowl, and the utensil's floor,
                                # keep that as extra clearance (the wrist camera then measures the food itself)
  scoop_end_follows: bowl       # the scoop end (where the swing starts) moves with the bowl (x, y, z) or the table (z)
  overlook_aim: tip             # what food_detect_start puts over the bowl: tip (the utensil: OVER is then only the
                                # food's offset in the bowl) or lens (the camera's axis; a tip far off the lens axis
                                # then needs a long OVER, over acquisition.over_max_m)
  overlook_offset_m: [0.0, 0.0] # the aim point this far (x, y) from the bowl's centre, still looking straight down
  overlook_seed_delta_deg: null # food_detect_start's arm shape: null = continuous IK out of the captured overlook;
                                # 7 values = one IK seeded with the captured joints + these (another shape)

features:                       # what to switch on and off
  resident_models: true         # make feed starts the servers and waits until every model is warm
  wait_for_open_mouth: true     # approach only once the user opens their mouth
  track_approach: false         # true: present by the tracked approach (delivery.track: closed loop, follows the
                                # head). false: the mouth measured once, as it opens, then one planned move (user)
  depth_fallback: true          # fill sensor depth holes from Depth Anything 3
  detect_from_the_side: true    # after the swing, step to the user's right before looking (food not in the way)
  bowl_once_per_session: true   # detect the bowl on the first bite, then reuse its box
  pick_in_one_program: true     # OVER + re-measure + plunge + scoop without restarting the arm program
  face_detector: mediapipe      # mediapipe (LocateAnything as its fallback) | locateanything
  food_detector:
    crop_to_bowl: true
    generation_mode: fast       # LocateAnything: fast | hybrid | slow
    stop_on_repeat: true
    max_new_tokens: 128
  utensil_cross_check: false    # also detect the utensil, to check its stored image region

motion:
  free_space:                   # detect, home, the swing, the retract's return: cuRobo paths (make planner)
    dps: 61.0                   # cruise, the furthest joint (just under 0.98 x the slowest joint's soft limit, 63)
    path_step_deg: 4            # cuRobo's dense path thinned to about this on the furthest joint (run_path re-times it)
    timeout_s: 30
    activation_distance_m: 0.01 # cuRobo's soft standoff (its default 0.03 refuses a utensil over the rim)
    world_padding_m: 0.01       # per side on every box (the bowl's pieces and the pedestal: none)
    floor_retries: 4            # a planned path under our floor: plan again (cuRobo's paths differ) this many times
    min_tip_above_table_m: 0.05 # our own floor for the utensil tip on these paths (scene.tip_floor) ...
    min_tip_above_bowl_m: 0.015 # ... above the bowl's top over the bowl
    bowl_margin_m: 0.04         # "over the bowl": within its rim radius + this
    user_mouth_m: [-0.277, 0.306, 0.397]   # the user in the planner's world until a delivery measures the mouth
    wheelchair: true            # the deployment wheelchair's boxes in the planner's world (sim/assets/wheelchair/
                                # wheelchair_boxes.yaml); false where the arm is not on the chair (a lab station)
  direct_dps: 20.0              # make start-direct: one joint move to feeding_start, no planner (SPEED=)
  joint_accel_cap_dps2: 72.0    # per joint, every trajectory (the controller refuses above 80)
  controller_accel_factor: 1.6  # the controller measures this much more acceleration than the time scaling plans:
                                # plan with the cap / this
  accel_retries: 4              # still refused on acceleration: rescale it by the controller's own measured /
                                # limit ratio and validate again at the same speed, up to this many times
  joint_limits_deg: {2: 128.9, 4: 147.8, 6: 120.3}   # J2 / J4 / J6; the others are continuous
  joint_limit_margin_deg: 0.3   # a target this close to a limit is refused (Kortex silently ignores it)
  plan_min_margin_deg: 3.0      # planned paths keep at least this from every limit
  max_tilt_deg: 25.0            # the utensil's worst allowed tilt off straight down (except scoop / delivery)
  no_progress_s: 3.0            # nothing moved by then: the controller ignored the move
  near_pose_deg: 1.0            # within this of a pose's joints = "at" that pose
  settle_dps: 10.0              # the final settle onto a measured pose
  goto_pad_s: 0.3               # a joint move's duration = travel / speed + this (the ramp at each end), at least
  goto_min_s: 0.8               # this
  goto_duration_retries: 3      # refused as faster than the arm's joint limits: re-sent at the controller's
                                # stated minimum (+5%), up to this many times
  max_joint_step_deg: 8         # a continuous IK path: a bigger step on any joint is a jump, not a path
  steer_within_deg: 25          # paths steer J2 / J4 / J6 away from a limit once within this of it ...
  steer_step_deg: 3.0           # ... by this much of IK guess per step
  speed_fallbacks: [1.0, 0.75, 0.5, 0.35]   # the controller refused a trajectory: retry at these fractions of its speed
  watch_extra_s: 15             # a trajectory not ended this long after its planned time: stop watching
  moved_deg: 0.05               # any joint this far from the start = the move began
  settle_speed_dps: 0.2         # after arriving, wait (at most settle_max_s) until every joint is slower than this
  settle_max_s: 2.0
  cartesian_orientation_dps: 10.0   # orientation speed limit of straight-line tool moves

guards:                         # contact guard: a joint-torque step this big against recent history = stop
  torque_window: {span: 12, gap: 5}   # samples: the baseline window, and the gap before the sample compared to it
  torque_step_nm:
    default: 2.5                # every move without its own entry
    approach: 4.0               # the user moving in the chair shakes the arm's mount past 2.5
    plunge_in_food: 8.0         # the plunge once the tines are in the food: firm food (grilled chicken, a foam pad)
                                # takes ~4 N.m to pierce; above the food the default holds
    scoop: 6.0                  # open air: 2.5 trips on the arm's own acceleration
    swing: 6.0
    retract: 6.0                # empty utensil, moving away
    free_space: 6.0             # detect / home: the braking on arrival reads up to ~3 N.m
  scoop_food_off_path_m: 0.015  # the food drifting this far from its planned path stops the scoop
  scoop_food_drop_m: 0.010      # ... or this far below it

acquisition:
  over_speed_mps: 0.15
  over_max_m: 0.10              # OVER is a small correction inside the bowl, never a transit
  over_level_tol_m: 0.002       # OVER's goal must be at the overlook height, within this
  over_depth_guess_m: 0.41      # where the floor measurement starts looking, from OVER (camera to food, m)
  plunge:
    fast_mps: 0.050
    slow_mps: 0.008             # through the food
    slow_above_food_m: 0.020    # the overlook reads the food top 4-7 mm high; this covers it
    in_food_from_above_m: 0.003 # the guard treats the tines as in the food this far before the measured top
    ik_step_m: 0.006
    speed_fallbacks: [1.0, 0.75, 0.5]   # the controller refused the plunge: retry at these fractions
    ramp_start_frac: 0.25       # the speed profile: starts at this fraction of fast_mps, full speed after ramp_m,
    ramp_m: 0.015               # and eases (smoothstep) to slow_mps over ease_m before the slow zone
    ease_m: 0.015
    sane_range_m: [0.080, 0.250]
    food_height_range_m: [0.010, 0.060]
    refuse_if_floor_filled_over: 0.5   # fraction of the floor reading from the depth fallback
    no_floor:                   # packed food: no bowl floor visible beside the target (the floor ring reads the
                                # neighbouring pieces: food "thinner" than food_height_range_m, or no floor at all)
      enabled: true
      floor_max_above_table_m: 0.025   # a "floor" higher than this above the table is food, not the floor
      depth_below_top_m: 0.025  # plunge this far below the target's top instead
      min_tip_above_table_m: 0.010   # never deeper than this above the table (workspace.table_height_m), whatever
                                     # the depth says ...
      min_into_food_m: 0.010         # ... and refused if that leaves less than this into the food
      refuse_if_top_filled_over: 0.5 # the top reading mostly from the Depth Anything 3 fallback: refused
  scoop:
    speed_dps: 55.0             # faster also holds the food better
    rot_exp: 0.8                # turn angle = 90 * s**rot_exp: <1 starts turning the moment the food lifts
    waypoints: 40
    backoff_from: 0.2           # fraction of the scoop before backing off toward the bowl's scoop end
    max_backoff_m: 0.300
    end_raise_m: 0.100          # the scoop ends this much above the bowl profile's calibrated scoop end (user: clear of the table)
    max_joint_step_deg: 12      # the scoop's continuous IK path: a bigger step on any joint is a jump
    default_food_height_m: 0.030   # a scoop run on its own with no record of the piece
  stepped:                      # the hover route, for aim checks (STOP_AFTER=hover10)
    hover_m: {hover30: 0.030, hover10: 0.010}          # the two hovers above the food top
    depth_guess_m: {hover30: 0.29, hover10: 0.275}     # the floor measurement's starting depth at each hover
    slow_zone_m: 0.020          # descend / punch: the last this-many mm at slow_mps
    punch_range_m: [0.010, 0.060]
    approach_stop_m: 0.010
    descend_max_m: 0.200
    fast_mps: 0.050             # as the plunge's fast stage
    slow_mps: 0.010             # the last slow_zone_m to each hover
    rise_mps: 0.040             # make rise: straight back up from a hover to the overlook height

perception:
  scene:                        # the fixed scene camera (make locate-scene): the COARSE bowl + table
    bowl_prompts: [dish, bowl, bowl with a glass jar]   # in order, until one yields a reachable bowl (~5 s each;
                                # from the side a bowl reads as a dish)
    max_reach_m: 0.75           # a candidate further than this from the arm's base is not the bowl
    detect_width: 848           # detect on a copy this wide (the detector's time grows with the pixels)
    max_bowl_height_m: 0.20     # inside the box, the bowl is what stands this high at most above the table ...
    max_bowl_radius_m: 0.15     # ... within this of the points' middle (an arm or a head in front is not the bowl)
    max_blocked_frac: 0.3       # more of the box than this taller than a bowl: the view is blocked, nothing located
    calibration:                # make calibrate-scene: the scene camera's pose from the arm (feeding/calibrate_scene.py)
      stride: 4                 # every n-th depth point
      gates_m: [0.06, 0.04, 0.025, 0.015]   # coarse to fine: points this near the arm's surface take part
      iterations: 8             # per gate
      start_turns_deg: [6, 12]  # the fit also starts from the guess turned this much about each camera axis
      max_rms_m: 0.008          # accepted only with the arm's points this close to its surface (rms) ...
      min_points: 300           # ... at least this many of them ...
      min_captures: 2           # ... from at least this many poses (one pose's chain leaves a rotation weak)
      max_age_s: 3600           # captures older than this are not used
      wrist_down_cos: 0.95      # the wrist camera looking this straight down: it measures the table's height
      crop_m: 0.25              # only points this near the arm (under the guess) take part ...
      table_points: 3000        # ... and about this many near the table's level
  min_box_side_px: 25
  max_box_aspect: 3.0
  food_inside_bowl_min: 0.8     # fraction of a food box inside the bowl box
  food_max_frac_of_bowl: 0.15   # a "food" box bigger than this is the bowl, not food
  inside_utensil_max: 0.5
  bowl_crop_margin_px: 20
  depth_frames: 15              # per-pixel median over this many fresh frames
  depth_fresh_wait_s: 3.0       # the depth server waits this long for fresh frames per try ...
  colour_stream:                # the resident colour reader (feeding/colour_stream.py, in the face server)
    gap_s: 0.5                  # no frame for this long = a gap, logged to runs_dir/colour_stream.jsonl
    reconnect_after_s: 3.0      # no frame for this long = reopen the stream
  depth_min_frames: 5           # the stream dropped out: a median of at least this many frames buffered since the
                                # arm stopped will do (the server keeps 5 s)
  depth_tries: 3                # ... this many times, before the caller falls back (the stream recovers in < 1 s)
  food_half_width_m: 0.017      # the floor ring beside the food (half a strawberry)
  utensil_depth_margin_m: 0.005 # under the tip, depth no farther than the tip + this is the utensil (feeding/measure_under)
  utensil_depth_border_px: 3    # ... and this many depth pixels round it (the sensor's edge pixels: utensil-or-behind)
  aim_top_surface: true         # aim at the uppermost piece's top inside the chosen box, not the box centre
  top_band_mm: 6.0              # its top = depth pixels within this of the box's nearest point
  food_left_above_floor_mm: 15  # no food box: the bowl is empty only if under food_left_min_frac of its inner area
  food_left_min_frac: 0.05      # stands this far above its floor -- else "food left, none pickable" (exit 5)

delivery:
  lift_m: 0.075                 # the swing's goal: this far above the scoop end (+ its end_raise_m: the same place), ...
  retract_tries_m: [0.120, 0.100, 0.080, 0.060, 0.040, 0.0]   # ... turned to the user, retracted the most of these
  swing_dps: 61.0
  swing_standoff_m: null        # null: the swing ends where the turn retracted to (retract_tries_m); a distance: the
                                # swing ends with the tip this far short of the known mouth (workspace.mouth_now),
                                # on its line -- the approach is then that much shorter
  detect_sidestep_m: 0.050      # to the user's right (-Y) before looking
  stop_m: 0.080                 # utensil tip short of the mouth (safe for any cube-sized piece)
  stop_extra_if_depth_filled_m: 0.040
  aim_dz_m: -0.010              # below the detected mouth
  approach_mps: 0.077           # toward the face; stops stop_m short, torque-guarded
  max_approach_m: 0.800         # the open-loop approach at most this long (a user sitting back)
  approach_step_m: 0.005        # its IK path in steps this long (a long one in 40 steps jumps)
  detection_max_age_s: 120.0
  sidestep_m: 0.050             # occlusion retries: step this far, at most twice, then the nose estimate
  nose_to_mouth: 0.84           # nose heights below the nose, upright image (0.81-0.87 measured)
  mouth_behind_nose_m: 0.005
  track:                        # the tracked approach (deliver.py track): one continuous move to the mouth, steered live
    rate_hz: 20                 # the control loop
    lookahead_s: 0.15           # each cycle: our IK for the pose this far ahead -> the joint speeds to reach it
    max_joint_dps: 30.0         # ... no joint faster than this (the direction kept)
    far_mps: 0.10               # the tip's speed far from the mouth ...
    near_mps: 0.04              # ... easing to this at stop_m
    slow_from_m: 0.35           # ... from this far from the mouth
    accel_mps2: 0.25            # the commanded velocity changes at most this fast (smooth starts and turns)
    gain_per_s: 1.5             # speed = gain x the distance left, at most the above (a soft arrival)
    arrive_m: 0.005             # arrived within this of the goal (stop_m short of the mouth, from depth)
    yaw_gain_per_s: 1.0         # the utensil turned toward the mouth: deg/s per deg off ...
    max_yaw_dps: 20.0           # ... at most this
    max_turn_deg: 30.0          # ... and at most this far from where the swing pointed it (the wrist turns with it)
    size_hold_m: 0.35           # while the mouth's range is only from the face's size: the tip holds this far short
    frame_max_age_s: 1.0        # a tracked face this old still steers (placed with the arm's pose at its time)
    hold_s: 1.0                 # no fresh face this long: ease to a hold where it is ...
    lost_timeout_s: 3.0         # ... this long: stop, the face lost
    timeout_s: 40.0
    max_travel_m: 1.0           # further than this without arriving: stop
    stall_s: 2.0                # told to move (> 3 x stall_m in this long) but moved under stall_m: stop (the
    stall_m: 0.01               # edge of reach: the arm cannot follow)
    max_tilt_cos: 0.25          # the utensil's axis more than this out of level: stop
    back_off_m: 0.10            # the retract starts straight back this far along the utensil
    poll_timeout_s: 0.1         # the face server's /track
    idle_s: 5.0                 # the tracker stops this long after its last request
    watchdog: true              # a second session stops the arm if the loop stops beating (kinova/scripts/twist_watchdog)
    watchdog_s: 0.3
  face:                         # the wrist camera's face finding (feeding/detect_mouth_mp.py)
    zoom_grid: 3                # no face in the whole frame: search n x n half-overlapping crops (a far user); 0 = off
    zoom_every_s: 0.5           # ... at most this often while they find nothing (each search is n x n detections)
    eye_corners_m: 0.090        # the outer eye corners' spacing: the face's range where the depth has none
    depth_beyond_eyes_factor: 1.6   # a face depth past this x its eye-spacing range (and 0.3 m beyond) is not the face's
  mouth_check:                  # a detected mouth box is used only if it is anatomically plausible against the nose
    max_box_frac: 0.03          # of the (upright) frame -- bigger = junk (also for the nose box)
    below_nose_heights: [0.4, 1.5]   # its centre this many nose heights below the nose's
    max_sideways_nose_widths: 1.0
    max_depth_diff_m: 0.030     # from the nose's depth
    depth_range_m: [0.25, 1.00] # a mouth outside this is not a face at the utensil (a stale / misregistered depth
                                # frame): look again, never approach
    max_face_diff_m: 0.080      # the mouth's depth vs the face box's median depth
  level_tol: 0.1                # |utensil axis z| below this = level (at the user)
  pointing_tol_cos: 0.99        # the utensil points at the user (+Y) / back along the swing: cos of the angle
  arrived_m: 0.003              # closer than this to a goal = already there
  sidestep_mps: 0.044
  goal_cache_tol_deg: 1.0       # the swing's goal is reused from within this of its start
  bite_baseline_samples: 40     # force samples at rest before the wait (~1 s)
  bite_settle_s: 10.0           # after the bite: watch at most this long for the force to settle
  open_mouth_ratio: 0.20        # inner-lip gap / mouth width; closed reads <= 0.02
  open_mouth_hold_s: 0.30
  open_mouth_gap_s: 0.30        # frames with no face found inside the hold: skipped, up to this long
  open_mouth_timeout_s: 60.0    # no open mouth by then = the user declined: take the food back
  bite_n: 2.0                   # tool-force estimate against a baseline at rest (user, 2026-10-02)
  bite_hold_s: 0.10
  bite_timeout_s: 60.0
  retract:
    back_off_mps: 0.20          # straight back from the mouth and on in toward the arm (one move)
    home_dps: 61.0              # the planned return to food_detect_start
    tuck_radii_m: [0.35, 0.45, 0.55]   # first the utensil tip pulled straight in to this far from the base's axis
                                # (the first the arm can hold level) ...
    reach_margin_m: 0.10        # ... then the planned return keeps it within its start's / goal's distance + this
    max_from_swing_end_m: 0.900 # further than this from where the swing ended = not backing off from here
                                # (the longest approach, max_approach_m, + a margin)
    back_off_m: 0.10            # straight back this far toward where the swing ended (null: all the way), then on in
                                # toward the arm in the same move, then cuRobo
